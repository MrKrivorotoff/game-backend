services:
  postgres:
    image: postgres:18.6
    #ports:
    #  - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - .env
  redis:
    image: redis:8.10
    #ports:
    #  - "6379:6379"
    volumes:
      - redis-data:/data
  inventory-service:
    build:
      context: .
      args:
        JAR_FILE: inventory-service/target/inventory-service.jar
  auth-service:
    build:
      context: .
      args:
        JAR_FILE: auth-service/target/auth-service.jar
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    env_file:
      - .env
    depends_on:
      - postgres
  client-gateway:
    build:
      context: .
      args:
        JAR_FILE: client-gateway/target/client-gateway.jar
    ports:
      - "8443:8443"
    env_file:
      - .env
    depends_on:
      - inventory-service
      - auth-service
volumes:
  postgres-data:
  redis-data: