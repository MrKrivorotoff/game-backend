services:
  database:
    image: postgres:18.6
    ports:
      - "5432:5432"
    env_file:
      - .env
  inventory-service:
    build:
      context: .
      args:
        JAR_FILE: inventory-service/target/inventory-service.jar
  login-service:
    build:
      context: .
      args:
        JAR_FILE: login-service/target/login-service.jar
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
    env_file:
      - .env
    depends_on:
      - database
  client-gateway:
    build:
      context: .
      args:
        JAR_FILE: client-gateway/target/client-gateway.jar
    ports:
      - "8443:8443"
    env_file:
      - .env
    depends_on:
      - inventory-service
      - login-service