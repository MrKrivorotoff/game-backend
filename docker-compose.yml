services:
  postgres:
    image: postgres:18.6
    #ports:
    #  - "5432:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
  redis:
    image: redis:8.10
    #ports:
    #  - "6379:6379"
    volumes:
      - redis-data:/data
  inventory-service:
    build:
      context: .
      args:
        JAR_FILE: inventory-service/target/inventory-service.jar
  auth-service:
    build:
      context: .
      args:
        JAR_FILE: auth-service/target/auth-service.jar
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    env_file:
      - .env
    depends_on:
      - postgres
  client-gateway:
    build:
      context: .
      args:
        JAR_FILE: client-gateway/target/client-gateway.jar
    ports:
      - "8443:8443"
    env_file:
      - .env
    depends_on:
      - inventory-service
      - auth-service
volumes:
  postgres-data:
  redis-data: